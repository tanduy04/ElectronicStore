version: '3.9'

services:
  # -------------------------------------------
  # SQL SERVER
  # -------------------------------------------
  sqlserver:
    container_name: sqlserver_container
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - sql_data:/var/opt/mssql
      - ./docker-assets/backups:/var/opt/mssql/backup
      - ./docker-assets/data.bak:/var/opt/mssql/backup/data.bak:ro
    healthcheck:
      test: ["CMD-SHELL", "echo SQL OK"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag_network

  # -------------------------------------------
  # QDRANT VECTOR DB
  # -------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vectordb
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

  # -------------------------------------------
  # API
  # -------------------------------------------
  api:
    container_name: electronicstore_api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ElectronicStore;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true"
      QDRANT__URL: "http://qdrant:6333"
    volumes:
      - ./wwwroot:/app/wwwroot
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rag_network

  # -------------------------------------------
  # RESTORE DB FROM BACKUP
  # -------------------------------------------
  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: sqlserver_init_runner
    depends_on:
      sqlserver:
        condition: service_started
    volumes:
      - ./docker-assets/data.bak:/var/opt/mssql/backup/data.bak:ro
      - ./docker-assets/init-from-bak.sh:/scripts/init-from-bak.sh:ro
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
    entrypoint: ["/bin/bash","/scripts/init-from-bak.sh"]
    restart: "no"
    networks:
      - rag_network

  # -------------------------------------------
  # BACKUP DB MANUAL
  # -------------------------------------------
  sqlserver-backup:
    image: mcr.microsoft.com/mssql-tools
    container_name: sqlserver_backup_runner
    depends_on:
      sqlserver:
        condition: service_started
    volumes:
      - ./docker-assets/backup-db.sh:/scripts/backup-db.sh:ro
      - ./docker-assets/backups:/var/opt/mssql/backup
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "echo 'Waiting for SQL Server...'; until /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$SA_PASSWORD\" -Q \"SELECT 1\" > /dev/null 2>&1; do sleep 2; done; echo 'Invoking backup script...'; /bin/bash /scripts/backup-db.sh"
    restart: "no"
    networks:
      - rag_network

  # -------------------------------------------
  # BACKUP SCHEDULER (INTERVAL)
  # -------------------------------------------
  sqlserver-backup-scheduler:
    image: mcr.microsoft.com/mssql-tools
    container_name: sqlserver_backup_scheduler
    depends_on:
      sqlserver:
        condition: service_started
    volumes:
      - ./docker-assets/backups:/var/opt/mssql/backup
      - ./docker-assets/backup-scheduler.sh:/scripts/backup-scheduler.sh:ro
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-3600}"
      DBNAME: "${DBNAME:-ElectronicStore}"
    entrypoint: ["/bin/sh","/scripts/backup-scheduler.sh"]
    restart: unless-stopped
    networks:
      - rag_network

  # -------------------------------------------
  # UPLOAD BACKUP TO CLOUD (RCLONE)
  # -------------------------------------------
  uploader-rclone:
    image: rclone/rclone:latest
    container_name: sqlserver_backup_uploader
    depends_on:
      sqlserver:
        condition: service_started
    volumes:
      - ./docker-assets/backups:/backups:rw
      - ./rclone.conf:/config/rclone/rclone.conf:ro
      - ./docker-assets/uploader-rclone.sh:/scripts/uploader-rclone.sh:ro
    environment:
      UPLOAD_INTERVAL_SECONDS: "${UPLOAD_INTERVAL_SECONDS:-300}"
      UPLOAD_POLL_INTERVAL_SECONDS: "${UPLOAD_POLL_INTERVAL_SECONDS:-5}"
      REMOVE_AFTER_UPLOAD: "${REMOVE_AFTER_UPLOAD:-true}"
      RCLONE_REMOTE: "${RCLONE_REMOTE:-ElectronicStoreDrive:Backups}"
    entrypoint: ["/bin/sh","/scripts/uploader-rclone.sh"]
    restart: unless-stopped
    networks:
      - rag_network

# -------------------------------------------
# NETWORKS & VOLUMES
# -------------------------------------------
networks:
  rag_network:
    driver: bridge

volumes:
  sql_data:
